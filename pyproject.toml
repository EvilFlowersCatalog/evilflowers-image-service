[project]
name = "evilflowers-image-service"
version = "1.0.0"
description = "Celery worker of the EvilFlowers catalog: figure crops, gates and optional captions of an extraction run (IP-018)"
readme = "README.md"
authors = [{ name = "Jakub Dubec", email = "jakub.dubec@stuba.sk" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    # The shared extraction-worker runtime: Celery app, job protocol, catalog client, shutdown, delivery cap,
    # observability. Pinned to a commit in [tool.uv.sources].
    "evilflowers-worker",
    "celery[redis]>=5.6,<6",
    "pillow>=11",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.6,<3",
    # Rendering only. 2.x hard-depends on onnxruntime and a layout model this worker never uses.
    "pymupdf>=1.26,<2",
    "python-dotenv>=1.0",
    "requests>=2.32",
]

[project.optional-dependencies]
# OTLP/HTTP to the node's Alloy (the kit pins the SDK, exporter and instrumentations).
otel = ["evilflowers-worker[otel]"]
# Pyroscope SDK: Python frames the node's eBPF profiler cannot unwind; on only with PYROSCOPE_SERVER_ADDRESS.
profiling = ["evilflowers-worker[profiling]"]

[dependency-groups]
# `uv sync` installs the core and this group only.
dev = [
    "opentelemetry-sdk==1.45.2",
    "pytest>=8.3",
    "ruff>=0.14",
]

[tool.uv.sources]
evilflowers-worker = { git = "https://github.com/EvilFlowersCatalog/evilflowers-worker", rev = "c37d860513662adcb85794adabea39af456ffee8" }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evilflowers_image"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning:importlib._bootstrap"]

[tool.ruff]
line-length = 119
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "LOG", "G"]

[tool.ruff.lint.isort]
known-first-party = ["evilflowers_image"]
